[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utl-geom2d"
version = "0.3.4"
authors = [{name = "Claude Zervas", email = "claude@utlco.com"}]
description = "Simple 2D geometry package"
readme = "README.rst"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]
keywords = ["2d", "geometry", "computational geometry", "bezier"]
dependencies = ["typing_extensions"]

[project.optional-dependencies]
test = ["pytest", "numpy"]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "numpy",
    "sphinx",
    "sphinx-autobuild",
    "sphinx_rtd_theme"
]

[project.urls]
repository = "https://github.com/utlco/utl-geom2d"

[project.scripts]

[tool.pytest.ini_options]
minversion="6.0"
addopts = "-ra -q -s"
testpaths = ["tests",]

[tool.pylint.MAIN]
extension-pkg-allow-list = ["lxml.etree"]

[tool.pylint."MESSAGES CONTROL"]
ignore-paths = [
    ".*saved.*",
    ".*unused.*",
    ".*contrib.*"
]
disable = [
    "too-many-locals",
    "too-many-lines",
    "missing-function-docstring",
    "consider-using-enumerate",
    "too-few-public-methods",
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-boolean-expressions",
    "fixme"
]

[tool.pylint.VARIABLES]
variable-rgx = "^_?[a-z][a-z0-9_]*$"
attr-rgx = "^_{0,2}[a-z][a-z0-9_]*$"
argument-rgx = "^_?[a-z][a-z0-9_]*$"
method-rgx = "(?x)^(?:(?P<exempt>_[a-z0-9_]+__|(test|assert)_*[A-Z0-9][a-zA-Z0-9_]*|next)|(?P<snake_case>_{0,2}[a-z][a-z0-9_]*))$"

[tool.ruff]
preview = true
target-version = "py310"
output-format = "concise"
extend-exclude = [
    "venv",
    "contrib",
    "tmp",
    "saved",
    "unused",
    "docs",
]


[tool.ruff.lint]
pylint.max-statements = 60
select = [
    "A",
    "B",
    "D",
    "E",
    "F",
    "G",
    "I",
    "Q",
    "W",
    "N",
    # "S", # asserts, non-crypto random, etc...
    "ANN",
    "AIR",
    "ARG",
    "BLE",
    # "FBT", # boolean positional params...
    "C4",
    "C90",
    "COM",
    # "CPY", # copyright...
    # "DOC", # docstring complaints
    "DTZ",
    "EM",
    "ERA",
    "EXE",
    "FA",
    # "FIX", # TODO complaints
    "FLY",
    "FURB",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "NPY",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "SLOT",
    "T20",
    # "TD", # TODO complaints
    "TC",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "YTT",
]
extend-ignore = [
    "zip-without-explicit-strict",
    "missing-trailing-comma",
    "undocumented-public-init",
    "too-many-arguments",
    "non-lowercase-variable-in-function",
    "raw-string-in-exception",
    "commented-out-code",
    "f-string-in-exception",
    "complex-structure",
    "raise-vanilla-args",
    "no-self-use", # should fix this
    "literal-membership",
    "magic-value-comparison",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-public-methods",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undocumented-public-package"]
"voronoi.py" = ["subclass-builtin"]
"tests/*" = [
    "print",
    "pytest-raises-too-broad",
    "typing-only-standard-library-import",
    "undocumented-public-function",
]

[tool.mypy]
mypy_path = "./src"
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = [
    "contrib",
    "tmp",
    "saved",
    "unused",
    "build",
    "docs",
]

[[tool.mypy.overrides]]
module = "contrib.clipper"
follow_imports = "skip"

[tool.typos]

[tool.typos.files]
extend-exclude = [
    "venv",
    "__pycache__",
    "saved",
    "build",
    "unused",
    "test",
    "contrib",
    "tmp",
    "out"
]

